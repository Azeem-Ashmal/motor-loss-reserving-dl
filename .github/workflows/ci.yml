name: CI

# Runs the full test suite and the full pipeline end to end on every push and
# pull request, against the bundled synthetic data ONLY - this workflow never
# touches, requires, or has access to the real underlying triangles, which are never
# committed to this repository (see data/README.md and .gitignore). Anyone
# who forks this repo and points scripts/run_all.py at their own real data
# locally can still do so exactly as documented in the README; this workflow
# does not run against anyone's real data, on this repo or a fork of it,
# because it never receives a --data-dir argument at all.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # A stable, broadly-available version for CI robustness. The
          # dissertation's own verified results were produced on the exact
          # environment pinned in requirements-lock.txt / env_block.tex
          # (Python 3.14.4); this workflow's job is to prove the pipeline
          # runs correctly and reproducibly on a clean checkout, not to
          # match that exact interpreter build.
          python-version: "3.12"

      - name: Install CPU-only PyTorch
        # Explicit CPU wheel index: the default PyPI torch build assumes a
        # possible CUDA install and is several times larger and slower to
        # fetch than necessary on a runner with no GPU, which is every
        # GitHub-hosted runner.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install remaining dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the full pipeline on the bundled synthetic data
        # Must run before the test suite: test_reconciliation.py checks
        # internal identities in outputs/results.json and skips itself
        # (rather than failing) if that file does not exist yet - on a
        # genuinely fresh checkout it never does until this step creates it.
        # Confirmed by simulating a clean checkout locally before trusting
        # this ordering: running the tests first silently skipped that whole
        # file (17 of 23 tests actually ran) instead of exercising it.
        run: python scripts/run_all.py

      - name: Run unit and reconciliation test suite
        run: python -m unittest discover -s tests -v

      - name: Regenerate figures from that run
        run: python scripts/make_figures.py

      - name: Upload this run's outputs as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pipeline-outputs
          path: outputs/
          retention-days: 14
